<h1 id="post-selection-architecture--file-structure">Post-selection: Architecture / File Structure</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>CFIsimulation/
├── main.py                     # Entry point: parse config, build circuit, run optimization
├── config.yaml                 # User-facing configuration file (all tunable parameters)
├── pyproject.toml              # Project metadata and dependencies
├── requirements.txt            # Pip dependency list
├── core/
│   ├── circuit.py              # Circuit class: assembles layers into a PennyLane QNode
│   ├── layers.py               # Layer: 
│   │                             Initialization, Entangler, RamseyZ, PostSelection
│   ├── trainer.py              # Trainer class: 
│   │                             CFI cost function, optimization, QFI benchmark
│   └── utils/
│       ├── arguments.py        # Dataclass for typed configuration 
│       │                         (circuitarguments, optarguments, etc.)
│       ├── customparser.py     # YAML config parser → dataclass instances
│       └── utils.py            # Hamiltonians, dephasing, density matrix plotting, 
│                                 file I/O helpers
├── dmplots/                    # Output directory for density matrix visualizations
└── paramplots/                 # Output directory for optimized parameter plots
</code></pre>
</section>

<h1 id="post-selection-density-matrix-analysis">Post-selection: Density Matrix Analysis</h1>
<p><strong>[ToDo]</strong> Entanglement investigation (two-qubit system) <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2190" d="M944 261T944 250T929 230H165Q167 228 182 216T211 189T244 152T277 96T303 25Q308 7 308 0Q308 -11 288 -11Q281 -11 278 -11T272 -7T267 2T263 21Q245 94 195 151T73 236Q58 242 55 247Q55 254 59 257T73 264Q121 283 158 314T215 375T247 434T264 480L267 497Q269 503 270 505T275 509T288 511Q308 511 308 500Q308 493 303 475Q293 438 278 406T246 352T215 315T185 287T165 270H929Q944 261 944 250Z"></path></g></g></g></svg></mjx-container> Isn't it already done?</p>
<p>The density matrix is optimized via the following procedure.</p>
<ol>
<li>Initialization</li>
<li>Entangler</li>
<li>Ramsey under dephasing noise</li>
<li>(Optional) Post-selction</li>
</ol>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>DQML/
├── main.py                    # Training entry point

<h1 id="distributed-quantum-machine-learning-data-set">Distributed Quantum Machine Learning: Data Set</h1>
<p>The dataset is a <strong>synthetic 9-dimensional clustered binary classification</strong> problem:</p>
<ol>
<li>
<p><strong>Define the cluster centers:</strong> From all <code>2^9 = 512</code> vertices of the hypercube <code>{-π/4, +π/4}^9</code>, randomly select 128 cluster centers. Half are assigned label 0, half label 1.</p>
</li>
<li>
<p><strong>Generate data points:</strong> For each cluster, generate 64 data points (<code>8192 / 128 = 64</code>) by:</p>
<ul>
<li>Sampling a point uniformly from a 9-dimensional ball of radius <code>π/4</code></li>
<li>Shifting it to the cluster center (subtracting the vertex coordinates)</li>
</ul>
</li>
<li>
<p><strong>Result:</strong> 8192 data points, each a 9-dimensional vector with values roughly in <code>[-π/2, π/2]</code>, with binary labels.</p>
</li>
</ol>
</section>

<h1 id="distributed-quantum-machine-learning-data-encoding">Distributed Quantum Machine Learning: Data Encoding</h1>
<p>The embedding uses an <strong>Ising-type feature map</strong>, which encodes data into both single-qubit rotations and two-qubit entangling interactions:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>For 3 qubits (one processor), depth=1:

     ┌───┐ ┌────────┐
q0 ──┤ H ├─┤ RZ(x0) ├──■─────────■──
     └───┘ └────────┘  │         │
     ┌───┐ ┌────────┐  │         │
q1 ──┤ H ├─┤ RZ(x1) ├──■────■────■──
     └───┘ └────────┘       │
     ┌───┐ ┌────────┐       │
q2 ──┤ H ├─┤ RZ(x2) ├───────■───────
     └───┘ └────────┘

IsingZZ angle = 0.5 * (π - x_i) * (π - x_{i+1})
</code></pre>
</section>
