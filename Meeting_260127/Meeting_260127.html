<h1 id="motivation">Motivation</h1>

<p><strong>The Challenge:</strong> How do we efficiently verify that a state has <em>genuine</em> multipartite entanglement that cannot be reduced to bipartite states?</p>

<h1 id="main-idea-fully-decomposable-witnesses">[Main Idea] Fully Decomposable Witnesses</h1>

<h1 id="summary">Summary</h1>
<h2 id="pros">Pros</h2>
<ul>
<li>The framework is systematic and complete.</li>
<li>It provides a unified SDP-based approach for detecting GME.</li>
<li>No false negatives within the PPT mixture class.</li>
<li>The entanglement monotone not only detects but also quantifies GME.</li>
</ul>
</section>

<h2 id="cons">Cons</h2>
<ul>
<li>
<p>Generally needs full density matrix <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.489ex;" xmlns="http://www.w3.org/2000/svg" width="1.17ex" height="1.489ex" role="img" focusable="false" viewBox="0 -442 517 658"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D70C" d="M58 -216Q25 -216 23 -186Q23 -176 73 26T127 234Q143 289 182 341Q252 427 341 441Q343 441 349 441T359 442Q432 442 471 394T510 276Q510 219 486 165T425 74T345 13T266 -10H255H248Q197 -10 165 35L160 41L133 -71Q108 -168 104 -181T92 -202Q76 -216 58 -216ZM424 322Q424 359 407 382T357 405Q322 405 287 376T231 300Q217 269 193 170L176 102Q193 26 260 26Q298 26 334 62Q367 92 389 158T418 266T424 322Z"></path></g></g></g></svg></mjx-container> — expensive quantum state tomography required</p>
